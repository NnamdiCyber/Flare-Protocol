<!DOCTYPE html>
<html lang="en" ng-app="flareApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flare Protocol</title>
  <style>
    /* ── Base reset ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
    }

    /* ── Navigation ───────────────────────────────────────────── */
    nav.flare-nav {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 60px;
      background: #161616;
      border-bottom: 1px solid #2a2a2a;
      gap: 32px;
    }

    nav.flare-nav .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ff6b00;
      text-decoration: none;
      margin-right: auto;
    }

    nav.flare-nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }

    nav.flare-nav a:hover,
    nav.flare-nav a.active {
      background: #2a2a2a;
      color: #fff;
    }

    /* ── Wallet connect button ────────────────────────────────── */
    .btn-wallet {
      margin-left: 8px;
      padding: 8px 16px;
      background: #ff6b00;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-wallet:hover { background: #e05d00; }

    .wallet-address {
      font-size: 0.8rem;
      color: #aaa;
      background: #2a2a2a;
      padding: 6px 12px;
      border-radius: 6px;
    }

    /* ── Main content ─────────────────────────────────────────── */
    .main-content {
      padding: 32px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── View transition ─────────────────────────────────────── */
    [ui-view] {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Navigation bar -->
  <nav class="flare-nav" ng-controller="NavCtrl">
    <a class="brand" href="#/">🔥 Flare Protocol</a>

    <!-- Earner portal links -->
    <a ui-sref="earner.campaigns" ui-sref-active="active">Browse Campaigns</a>
    <a ui-sref="earner.dashboard" ui-sref-active="active">My Earnings</a>

    <!-- Separator -->
    <span style="color:#333; user-select:none;">|</span>

    <!-- Advertiser portal links -->
    <a ui-sref="advertiser.dashboard" ui-sref-active="active">Advertiser</a>
    <a ui-sref="advertiser.create" ui-sref-active="active">Create Campaign</a>

    <!-- Wallet status -->
    <div ng-if="!walletAddress">
      <button class="btn-wallet" ng-click="connectWallet()">Connect Wallet</button>
    </div>
    <div ng-if="walletAddress">
      <span class="wallet-address" title="{{ walletAddress }}">
        {{ walletAddress | limitTo:6 }}…{{ walletAddress | limitTo:-4 }}
      </span>
    </div>
  </nav>

  <!-- Router outlet -->
  <div class="main-content">
    <div ui-view></div>
  </div>

</body>
</html>
