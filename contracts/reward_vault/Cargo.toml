[package]
name = "reward_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "20.0.0" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
rand = { version = "0.8.5" }
